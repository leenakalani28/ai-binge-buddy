[project]
name = "ai-binge-buddy"
version = "0.1.0"
description = "A cinematic, fair group movie-night decision maker"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.42,<2", "httpx>=0.27,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
